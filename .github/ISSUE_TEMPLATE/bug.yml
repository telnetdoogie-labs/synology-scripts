name: Bug Report
title: "[BUG] - [Short description of the bug]"
description: Report a reproducible bug.
type: "Bug"
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is, including any error messages.
    validations:
      required: true
  - type: textarea
    attributes:
      label: To reproduce
      description: |
        Steps to reproduce the behavior:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Log file
      description: Capture the entire output of any logs here.
      render: shell
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.